[package]
name = "bwk"
version = "0.0.8"
readme.workspace = true
description = "Bitcoin wallet kit"
documentation = "https://docs.rs/bwk"
license-file.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
exclude = ["tests/**"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
bwk-electrum.workspace = true
bwk-backoff.workspace = true
bwk-keys.workspace = true
bwk-descriptor.workspace = true
bwk-persist.workspace = true
bwk-sign = { workspace = true, default-features = false, features = ["sp"] }
bwk-utils.workspace = true
bwk-coin.workspace = true
bwk-tx.workspace = true

miniscript.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = { workspace = true, optional = true }
bip39 = { workspace = true, features = ["serde", "rand"] }
thiserror.workspace = true

[dev-dependencies]
env_logger = { workspace = true }
bwk-persist = { workspace = true, features = ["test"] }
electrsd = { git = "https://github.com/pythcoiner/electrsd.git", branch = "buffered_logs"}
rand = "0.9.0"
temp-dir.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[features]
default = []
sp = []
hwi = ["bwk-sign/hwi"]
sqlite = ["bwk-persist/sqlite"]
test = ["bwk-utils/test", "bwk-sign/test", "bwk-tx/test", "bwk-persist/test", "logger"]
# Installs env_logger through `log::Logger`. Off by default: a consumer with its
# own logger would otherwise pull env_logger and its timestamp/colour stack.
logger = ["dep:env_logger"]
