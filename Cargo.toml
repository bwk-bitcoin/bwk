[workspace]
resolver = "3"

members = [
    "bwk",
    "sp",
    "electrum",
    "backoff",
    "error",
    "coin",
    "keys", "utils", "sign", "descriptor", "tx",
    "persist",
    "p2p",
    "hwi", "hwi/cli",
    "hwi/ledger-bitcoin-client", "hwi/ledger-transport-hidapi", "hwi/bitbox-api",
    "secp256k1_spscan-sys",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
authors = ["pythcoiner"]
license-file = "LICENSE"
repository = "https://github.com/pythcoiner/bwk"
keywords = ["bitcoin"]
readme = "README.md"

[workspace.dependencies]
crossbeam = "0.8"
bwk-hwi = { path = "hwi", default-features = false }
base64ct = "=1.6.0"
url = "=2.5.2"
bip39 = "2.2.0"
bitcoin = { version = "0.32", features = ["serde"] }
bitcoin_slices = "0.8.0"
hex = "0.4"
hex-conservative = "0.2.1"
hex_lit = "0.1.1"
libc = "0.2.170"
log = "0.4.20"
miniscript = { version = "12.2.0", features = ["base64"] }
native-tls = "0.2"
openssl = "0.10.66"
plotters = "0.3.7"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.128"
syn = { version = "2.0", default-features = false, features = ["derive", "full", "parsing", "printing", "proc-macro"] }
env_logger = "0.11.6"
temp-dir = "0.1.16"
getrandom = "0.2"
corepc-node = { version = "0.10", features = ["download", "29_0"] }
electrsd = { git = "https://github.com/pythcoiner/electrsd.git", branch = "buffered_logs" }
dns-lookup = "2.0"
trybuild = "1.0"

# spdk dependencies
secp256k1_spscan-sys = { path = "secp256k1_spscan-sys" }
blindbitd = { git = "https://github.com/pythcoiner/blindbitd.git" }
bdk_coin_select = "0.4.0"
secp256k1 = { version = "0.29.1", features = ["rand", "global-context"] }
bitcoin_hashes = "0.13.0"
bech32 = "0.9"
bimap = "0.6"
ureq = { version = "3.3", default-features = false }

# bwk crates
bwk-electrum = { path = "electrum" }
bwk-backoff = { path = "backoff" }
bwk-coin = { path = "coin" }
bwk-keys = { path = "keys" }
bwk-tx = { path = "tx" }
bwk-sign = { path = "sign", default-features = false }
bwk-descriptor = { path = "descriptor" }
bwk-persist = { path = "persist" }
bwk-utils = { path = "utils" }
bwk-p2p = { path = "p2p" }
bwk = { path = "bwk" }
# bwk-error is the in-house derive. Aliasing the package as `thiserror` is deliberate,
# not an oversight: error definitions across the tree keep reading `thiserror::Error`,
# so the switch is a one-line manifest change instead of a rename touching every error
# enum, which keeps the diff and the review surface small. Upstream thiserror is not a
# direct dependency of this workspace, so its extras (`#[backtrace]`, generics,
# lifetimes, ...) are unavailable. See error/README.md.
thiserror = { package = "bwk-error", path = "error" }
