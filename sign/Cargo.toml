[package]
name = "bwk-sign"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true
readme.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
crossbeam.workspace = true
bwk-keys.workspace = true
bwk-descriptor.workspace = true
bwk-persist.workspace = true
bwk-psbt.workspace = true
bwk-utils.workspace = true
bip39 = { workspace = true, features = ["rand"] }
serde.workspace = true
serde_json.workspace = true
miniscript.workspace = true
log.workspace = true

# `bwk-hwi` pulls in the USB/HID hardware-wallet stack (coldcard -> hidapi ->
# libudev), which cannot cross-compile to Android. Gate it off Android targets;
# desktop/host builds keep the full hardware-wallet support.
[target.'cfg(not(target_os = "android"))'.dependencies]
bwk-hwi = { workspace = true, features = ["service"], optional = true }

[features]
default = ["hwi", "sp"]
test = ["bwk-utils/test"]
sp = []
# Marker feature only. The actual `bwk-hwi` optional dependency is auto-enabled
# by the `hwi` feature on non-Android targets (see the target table above). It is
# not referenced via `dep:` here so that enabling `hwi` on Android (where the
# dependency does not exist) resolves cleanly. Code paths that touch `bwk_hwi`
# are additionally gated with `not(target_os = "android")`.
hwi = ["dep:bwk-hwi"]
