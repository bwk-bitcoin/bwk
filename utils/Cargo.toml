[package]
name = "bwk-utils"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true
readme.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
miniscript.workspace = true
bitcoin.workspace = true
rand.workspace = true
env_logger = { workspace = true, optional = true }
log.workspace = true
ureq = { workspace = true, optional = true }
corepc-node = { workspace = true, optional = true }
temp-dir = { workspace = true, optional = true }
electrsd = { git = "https://github.com/pythcoiner/electrsd.git", branch = "buffered_logs", optional = true }
bwk-sign = { workspace = true, default-features = false, optional = true }
crossbeam = { workspace = true, optional = true }

[features]
default = []
test = [
    "dep:bwk-sign",
    "dep:corepc-node",
    "dep:crossbeam",
    "dep:electrsd",
    "dep:env_logger",
    "dep:temp-dir",
    "bitcoin/rand-std",
]
ureq = ["dep:ureq"]
