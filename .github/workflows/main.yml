name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linter:
    name: "tip: lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88
          components: rustfmt, clippy
          override: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: rustfmt
        run: scripts/ci-checks.sh fmt
      - name: clippy
        run: scripts/ci-checks.sh clippy

  tests:
    name: "tip: test ${{ matrix.toolchain }}"
    needs: linter
    strategy:
      matrix:
        toolchain:
          - 1.88
          - nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev gdb
      - name: tests
        run: scripts/ci-checks.sh tests

  p2p-tests:
    name: "tip: test p2p"
    needs: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88
          override: true
          profile: minimal
      - name: p2p tests
        run: scripts/ci-checks.sh p2p-tests

  build:
    name: "tip: build ${{ matrix.toolchain }}"
    needs:
      - tests
      - p2p-tests
    strategy:
      matrix:
        toolchain:
          - 1.88
          - nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: build
        run: scripts/ci-checks.sh build
      - name: default build
        run: scripts/ci-checks.sh default-build

  # Build the Ledger Bitcoin app once per device, cached on app version, builder
  # image and device. Pins live in hwi/tests/speculos/versions.env, shared with
  # hwi/tests/speculos/run.sh.
  ledger_app:
    name: build ledger app (${{ matrix.device }})
    needs: linter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: nanox
            sdk_env: NANOX_SDK
          - device: nanosp
            sdk_env: NANOSP_SDK
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        run: grep -E "^[A-Z_]+=" hwi/tests/speculos/versions.env >> "$GITHUB_ENV"

      - name: Cache Ledger app .elf
        id: cache-elf
        uses: actions/cache@v4
        with:
          path: app-bitcoin-new/bin/app.elf
          key: ledger-app-${{ matrix.device }}-${{ env.LEDGER_APP_VERSION }}-${{ env.LEDGER_APP_BUILDER_IMAGE }}

      - name: Build Ledger Bitcoin app (${{ matrix.device }})
        if: steps.cache-elf.outputs.cache-hit != 'true'
        env:
          SDK_VAR: ${{ matrix.sdk_env }}
        run: |
          git clone --branch "$LEDGER_APP_VERSION" --depth 1 \
            https://github.com/LedgerHQ/app-bitcoin-new.git
          # SDK_VAR names the SDK env var of the image (e.g. NANOX_SDK).
          docker run --rm -e CPATH=/app/src -e SDK_VAR="$SDK_VAR" -e JOBS="${CARGO_BUILD_JOBS:-6}" \
            -u "$(id -u):$(id -g)" -v "$PWD/app-bitcoin-new:/app" -w /app \
            "$LEDGER_APP_BUILDER_IMAGE" \
            bash -c 'make -j"$JOBS" BOLOS_SDK="${!SDK_VAR}" COIN=bitcoin_testnet'

      - uses: actions/upload-artifact@v4
        with:
          name: ledger_app_${{ matrix.device }}
          path: app-bitcoin-new/bin/app.elf
          if-no-files-found: error
          retention-days: 1

  # Drive LedgerSimulator (hwi/src/ledger.rs) against the Ledger Bitcoin app
  # under Speculos; the speculos crate spawns hwi/tests/speculos/speculos-docker.sh,
  # which runs the pinned Speculos image.
  speculos:
    name: speculos integration (${{ matrix.device }})
    needs: [tests, ledger_app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [nanox, nanosp]
    steps:
      - uses: actions/checkout@v4

      - name: Load version pins
        run: grep -E "^[A-Z_]+=" hwi/tests/speculos/versions.env >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88
          cache: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Pull Speculos image
        run: docker pull "$SPECULOS_IMAGE"

      - name: Download Ledger app artifact
        uses: actions/download-artifact@v4
        with:
          name: ledger_app_${{ matrix.device }}
          path: ledger_app

      # --test-threads=1: one Speculos child and one APDU socket at a time.
      - name: Run ignored speculos tests
        env:
          SPECULOS_ELF: ${{ github.workspace }}/ledger_app/app.elf
          SPECULOS_BIN: ${{ github.workspace }}/hwi/tests/speculos/speculos-docker.sh
          SPECULOS_MODEL: ${{ matrix.device }}
        run: |
          cargo test -p bwk-hwi --features ledger --test ledger_speculos -- --ignored --nocapture --test-threads=1
          cargo test -p bwk-hwi --features ledger,musig --test ledger_musig_speculos -- --ignored --nocapture --test-threads=1
          cargo test -p bwk-hwi --features ledger,musig --test ledger_service_speculos -- --ignored --nocapture --test-threads=1
