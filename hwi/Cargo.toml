[package]
name = "bwk-hwi"
version = "0.1.0"
readme = "README.md"
description = "Hardware wallet interface"
edition.workspace = true
authors.workspace = true
license = "MIT AND BSD-3-Clause AND Apache-2.0"
repository.workspace = true
keywords.workspace = true

[features]
default = ["ledger", "specter", "coldcard", "bitbox", "jade", "service"]
bitbox = [
    "base32",
    "byteorder",
    "chrono",
    "getrandom",
    "hex",
    "hidapi",
    "noise-protocol",
    "noise-rust-crypto",
    "num-bigint",
    "prost",
    "regex",
    "semver",
    "serde",
    "serde_json",
    "zeroize",
]
coldcard = ["dep:coldcard", "hidapi", "regex"]
specter = ["serialport"]
jade = ["regex", "serde", "serde_bytes", "serde_cbor", "serialport", "ureq"]
ledger = ["byteorder", "hex", "hidapi", "ledger-apdu", "log", "miniscript", "regex"]
regex = ["dep:regex"]
service = ["bitbox", "coldcard", "jade", "ledger", "specter", "tracing", "hex", "crossbeam"]

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["base64", "serde", "std"] }
thiserror.workspace = true

# specter & jade
serialport = { version = "4.3", optional = true }

# jade & bitbox
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.14", optional = true }
serde_cbor = { version = "0.11", optional = true }
ureq = { version = "3", features = ["json"], optional = true }

# bitbox
base32 = { version = "0.4", optional = true }
chrono = { version = "0.4.38", default-features = false, features = ["clock"], optional = true }
getrandom = { version = "0.2", optional = true }
noise-protocol = { version = "0.2", optional = true }
noise-rust-crypto = { version = "0.6", optional = true }
num-bigint = { version = "0.4", optional = true }
prost = { version = "0.13", optional = true }
semver = { version = "1.0.17", optional = true }
serde_json = { version = "1.0", optional = true }
zeroize = { version = "1", optional = true }

# coldcard
coldcard = { version = "0.13.0", optional = true }

# ledger
miniscript = { version = "12.2", features = ["no-std"], default-features = false, optional = true }
ledger-apdu = { version = "0.10", optional = true }
log = { version = "0.4", optional = true }

# bitbox & ledger
byteorder = { version = "1.4", optional = true }
hidapi = { version = "2.5.1", features = ["linux-static-hidraw"], default-features = false, optional = true }
regex = { version = "1.6.0", optional = true }

# bitbox, ledger & service
hex = { version = "0.4.3", optional = true }

# service module (requires all device features)
tracing = { version = "0.1.37", optional = true }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"], optional = true }
