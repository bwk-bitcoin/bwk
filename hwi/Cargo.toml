[package]
name = "bwk-hwi"
version = "0.0.30"
readme = "README.md"
description = "Hardware wallet interface"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
default = ["ledger", "specter", "coldcard", "bitbox", "jade", "service"]
bitbox = ["hidapi", "bitbox-api", "regex"]
coldcard = ["dep:coldcard", "hidapi", "regex"]
specter = ["serialport"]
jade = ["regex", "serde", "serde_bytes", "serde_cbor", "serialport", "ureq"]
ledger = ["regex", "ledger-bitcoin-client", "ledger-transport-hidapi", "ledger-apdu", "hidapi"]
regex = ["dep:regex"]
service = ["bitbox", "coldcard", "jade", "ledger", "specter", "tracing", "hex", "crossbeam"]

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["base64", "serde", "std"] }

# specter & jade
serialport = { version = "4.3", optional = true }

# jade
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.14", optional = true }
serde_cbor = { version = "0.11", optional = true }
ureq = { version = "3", features = ["json"], optional = true }

# bitbox
bitbox-api = { path = "bitbox-api", default-features = false, features = ["usb"], optional = true }

# coldcard
coldcard = { version = "0.13.0", optional = true }

# ledger
ledger-bitcoin-client = { path = "ledger-bitcoin-client", optional = true }
ledger-apdu = { version = "0.10", optional = true }
ledger-transport-hidapi = { path = "ledger-transport-hidapi", optional = true }

# bitbox & ledger
hidapi = { version = "2.5.1", features = ["linux-static-hidraw"], default-features = false, optional = true }
regex = { version = "1.6.0", optional = true }

# service module (requires all device features)
tracing = { version = "0.1.37", optional = true }
hex = { version = "0.4.3", optional = true }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"], optional = true }
